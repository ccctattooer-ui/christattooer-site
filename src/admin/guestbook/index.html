<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Guestbook · Chris Tattooer admin</title>
<link rel="icon" href="/assets/favicon.png">
<style>
  :root{--ink:#15121A;--bone:#EFEAD9;--stencil:#4B2E9C;--yellow:#F0C22E;--red:#D3322A;--green:#3BAA6E;--rule:#d9d2bd}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding-inline:16px;padding-block:0 40px}
  header{position:sticky;top:0;background:#fff;border-bottom:3px solid var(--ink);padding:12px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;z-index:5}
  header h1{font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:0 auto 0 0}
  header a{color:var(--stencil);font-size:13px}
  button{font:inherit;font-weight:700;padding:8px 14px;border:2px solid var(--ink);background:var(--bone);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
  button:disabled{opacity:.4;cursor:default;box-shadow:none}
  button.go{background:var(--green);color:#fff}
  button.hide{background:var(--yellow)}
  button.kill{background:var(--red);color:#fff}
  #status{font-size:13px;min-width:170px}
  #status.ok{color:var(--green)} #status.err{color:var(--red)}
  .login{max-width:330px;margin:60px auto;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:20px;background:var(--bone)}
  .login label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:10px 0 4px}
  .login input{width:100%;font:inherit;padding:9px;border:2px solid var(--ink)}
  .login button{width:100%;margin-top:16px;background:var(--stencil);color:#fff}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0;border-bottom:2px solid var(--rule)}
  .bar .count{font-size:13px;color:#666;margin-right:auto}
  ul{list-style:none;margin:0;padding:0}
  li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--rule)}
  li.waiting{background:#fffbe9}
  li input[type=checkbox]{width:20px;height:20px;margin-top:3px}
  .msg{margin:0 0 5px;white-space:pre-wrap;overflow-wrap:anywhere}
  .who{font-size:12px;color:#666}
  .who b{color:var(--stencil)}
  .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border:2px solid var(--ink);white-space:nowrap}
  .tag.up{background:#cfe8d4}
  .tag.wait{background:var(--yellow)}
  .empty{padding:30px 0;color:#666}
  .note{background:#fff3c4;border:2px solid var(--ink);padding:10px 12px;font-size:13px;margin:14px 0}
</style>
</head>
<body>

<div class="login" id="login">
  <h1 style="font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px">Guestbook</h1>
  <p style="font-size:13px;color:#555;margin:0">Same username and password as the rest of the admin.</p>
  <label for="u">Username</label><input id="u" autocomplete="username">
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
  <button id="go" type="button">Log in</button>
  <p id="loginerr" style="color:var(--red);font-size:13px;margin:10px 0 0"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>Guestbook</h1>
    <span id="status"></span>
    <a href="/admin/">← back to the admin</a>
  </header>

  <p class="note">Nothing a visitor writes shows on the site until you approve it here. Hiding one puts it back out of sight; deleting is forever.</p>

  <div class="bar">
    <span class="count" id="count"></span>
    <button type="button" id="all">Select all waiting</button>
    <button type="button" id="none">Clear</button>
    <button type="button" class="go" id="approve" disabled>Approve</button>
    <button type="button" class="hide" id="hide" disabled>Hide</button>
    <button type="button" class="kill" id="del" disabled>Delete</button>
  </div>

  <ul id="list"></ul>
</div>

<script>
(function () {
  var auth = "", entries = [];
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
  var when = function (ms) { return new Date(Number(ms)).toLocaleString(); };

  function say(msg, bad) {
    var el = $("#status");
    el.textContent = msg; el.className = bad ? "err" : "ok";
    if (msg) setTimeout(function () { if (el.textContent === msg) el.textContent = ""; }, 4000);
  }

  function api(method, body) {
    return fetch("/admin/api/guestbook", {
      method: method,
      headers: Object.assign({ authorization: "Basic " + auth }, body ? { "content-type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); });
  }

  function picked() {
    return [].slice.call(document.querySelectorAll("#list input:checked")).map(function (c) { return Number(c.value); });
  }
  function syncButtons() {
    var n = picked().length;
    ["#approve", "#hide", "#del"].forEach(function (s) { $(s).disabled = !n; });
  }

  function paint() {
    var waiting = entries.filter(function (e) { return !e.approved; }).length;
    $("#count").textContent = entries.length + " total · " + waiting + " waiting on you";
    if (!entries.length) { $("#list").innerHTML = '<p class="empty">Nothing in the book yet.</p>'; return; }
    $("#list").innerHTML = entries.map(function (e) {
      return '<li class="' + (e.approved ? "" : "waiting") + '">' +
        '<input type="checkbox" value="' + e.id + '" aria-label="Select this entry">' +
        '<div><p class="msg">' + esc(e.message) + "</p>" +
        '<p class="who"><b>' + esc(e.name) + "</b> · " + when(e.created_at) + "</p></div>" +
        '<span class="tag ' + (e.approved ? "up" : "wait") + '">' + (e.approved ? "on the site" : "waiting") + "</span></li>";
    }).join("");
    [].slice.call(document.querySelectorAll("#list input")).forEach(function (c) {
      c.addEventListener("change", syncButtons);
    });
    syncButtons();
  }

  function load() {
    return api("GET").then(function (r) {
      if (r.status === 401) throw new Error("Wrong username or password.");
      if (r.data.error) throw new Error(r.data.error);
      entries = r.data.entries || [];
      paint();
    });
  }

  function act(action, word) {
    var ids = picked();
    if (!ids.length) return;
    if (action === "delete" && !window.confirm("Delete " + ids.length + " entr" + (ids.length === 1 ? "y" : "ies") + " for good?")) return;
    say("Working…");
    api("POST", { action: action, ids: ids })
      .then(function (r) {
        if (r.data.error) throw new Error(r.data.error);
        return load().then(function () { say(word + " " + r.data.changed + "."); });
      })
      .catch(function (e) { say(e.message, true); });
  }

  $("#go").addEventListener("click", function () {
    auth = btoa($("#u").value + ":" + $("#p").value);
    $("#loginerr").textContent = "";
    load().then(function () {
      $("#login").hidden = true; $("#app").hidden = false;
      try { sessionStorage.setItem("ct-gb-auth", auth); } catch (e) {}
    }).catch(function (e) { $("#loginerr").textContent = e.message; });
  });
  $("#p").addEventListener("keydown", function (e) { if (e.key === "Enter") $("#go").click(); });

  $("#all").addEventListener("click", function () {
    [].slice.call(document.querySelectorAll("#list li.waiting input")).forEach(function (c) { c.checked = true; });
    syncButtons();
  });
  $("#none").addEventListener("click", function () {
    [].slice.call(document.querySelectorAll("#list input")).forEach(function (c) { c.checked = false; });
    syncButtons();
  });
  $("#approve").addEventListener("click", function () { act("approve", "Approved"); });
  $("#hide").addEventListener("click", function () { act("hide", "Hidden"); });
  $("#del").addEventListener("click", function () { act("delete", "Deleted"); });

  // carry the login across a refresh, same as the price sheet
  try {
    var saved = sessionStorage.getItem("ct-gb-auth");
    if (saved) {
      auth = saved;
      load().then(function () { $("#login").hidden = true; $("#app").hidden = false; }).catch(function () {});
    }
  } catch (e) {}
})();
</script>
</body>
</html>
