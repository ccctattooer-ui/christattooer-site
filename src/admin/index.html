<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Chris Tattooer</title>
<link rel="icon" href="/assets/favicon.png">
</head>
<body>
<div style="position:fixed;right:12px;bottom:12px;z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:flex-end">
  <a href="/admin/guestbook/" style="background:#15121A;color:#F0C22E;font:700 13px system-ui,sans-serif;padding:8px 12px;border:2px solid #15121A;box-shadow:3px 3px 0 #15121A;text-decoration:none">Guestbook to approve ↗</a>
  <a href="/admin/prices/" style="background:#4B2E9C;color:#fff;font:700 13px system-ui,sans-serif;padding:8px 12px;border:2px solid #15121A;box-shadow:3px 3px 0 #15121A;text-decoration:none">Quick edit all designs ↗</a>
</div>
<div id="flash-tip" hidden style="position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:9999;background:#F0C22E;color:#15121A;font:600 13px system-ui,sans-serif;padding:8px 14px;border:2px solid #15121A;box-shadow:3px 3px 0 #15121A;white-space:nowrap">Editing prices, sizes or names for many designs? <a href="/admin/prices/" style="color:#4B2E9C">Use the quick edit grid ↗</a></div>
<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
<script>
  // Sveltia's stock login button says "Sign in with GitHub". Ours opens the username/password box
  // (functions/admin/auth.js), so relabel it and hide the access-token option.
  (function () {
    var relabel = function () {
      document.querySelectorAll('button, a').forEach(function (el) {
        var t = (el.textContent || '').trim();
        if (/sign in with github/i.test(t)) el.textContent = 'Log in';
        else if (/access token/i.test(t)) el.style.display = 'none';
      });
    };
    new MutationObserver(relabel).observe(document.documentElement, { childList: true, subtree: true });
    relabel();
    // Point to the quick-edit grid whenever the Flash designs list is open.
    var tip = function () { document.getElementById('flash-tip').hidden = !/collections\/flash\/?$/.test(location.hash); };
    window.addEventListener('hashchange', tip); tip();
  })();
</script>
</body>
</html>
