# Sveltia CMS config for christattooer.com. Log in at /admin/ (username + password).
# Every save is a commit to the GitHub repo; Cloudflare Pages rebuilds the site a minute or two later.
backend:
  name: github
  repo: ccctattooer-ui/christattooer-site
  branch: main
  base_url: https://christattooer.com
  auth_endpoint: admin/auth

site_url: https://christattooer.com
display_url: https://christattooer.com
logo_url: /assets/favicon.png

# Default upload folder (used only by fields that don't set their own).
media_folder: assets/uploads
public_folder: /assets/uploads

media_libraries:
  default:
    config:
      max_file_size: 15728640
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000
        svg:
          optimize: true

collections:
  # ---------------------------------------------------------------- catalog
  - name: flash
    label: Flash designs
    label_singular: Flash design
    description: One entry per design in the catalog. New designs need a SKU (FL-072, FL-073…), a drawing, a size and a price.
    folder: content/flash
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{sku}}"
    identifier_field: name
    summary: "{{sku}} · {{name}} · {{size}} · ${{price}}"
    sortable_fields: [sku, name, category, price]
    media_folder: /assets/flash/web
    public_folder: /assets/flash/web
    fields:
      - { label: SKU, name: sku, widget: string, pattern: ['^FL-\d{3}$', 'Use the form FL-072 (FL, dash, three digits).'], hint: Unique catalog number. Keep the format FL-###. }
      - { label: Name, name: name, widget: string }
      - { label: Category, name: category, widget: select, options: ['Faces & characters', 'Skulls & devils', 'Symbols', 'Flowers & plants', 'Animals', 'Lettering'] }
      - { label: Drawing, name: image, widget: image, hint: A cutout with a transparent or white background looks best. Big files are shrunk automatically. }
      - { label: Size, name: size, widget: string, hint: 'Shown exactly as typed, e.g. 3 in or 2.5 x 4 in.' }
      - { label: Price, name: price, widget: number, value_type: int, min: 0, step: 5, hint: Dollars, no $ sign. }
      - { label: Est. time (hours), name: hours, widget: number, value_type: float, min: 0, step: 0.5, required: false, hint: Leave blank to hide the time line. }
      - { label: Available, name: available, widget: boolean, default: true, hint: Off marks it Claimed and disables the Add button. }
      - { label: Notes, name: notes, widget: text, required: false, hint: One short line shown on the card. }

  - name: work
    label: Healed & recent work
    label_singular: Photo
    description: Photos on the Work page. Featured photos also show on the home page (first 8 by default) and get a star.
    folder: content/work
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{uuid_short}}"
    identifier_field: title
    summary: "{{filename}} · {{title}}"
    sortable_fields: [title, placement, featured, hidden]
    media_folder: /assets/tattoos
    public_folder: /assets/tattoos
    fields:
      - { label: Photo, name: image, widget: image, hint: Phone photos are shrunk automatically. }
      - { label: Title, name: title, widget: string, required: false, hint: e.g. Panther head. Shows under the photo. }
      - { label: Placement, name: placement, widget: string, required: false, hint: e.g. outer forearm }
      - { label: Style, name: style, widget: string, required: false }
      - { label: Hours, name: hours, widget: number, value_type: float, min: 0, step: 0.5, required: false }
      - { label: Notes, name: notes, widget: text, required: false }
      - { label: Featured, name: featured, widget: boolean, default: false, required: false, hint: Home page + starred on the Work page. }
      - { label: Hidden, name: hidden, widget: boolean, default: false, required: false }
      - { label: Original file, name: source, widget: hidden, required: false }

  # ---------------------------------------------------------------- departments
  - name: paintings
    label: Paintings
    description: The collage board in the Paintings department. Drag rows to reorder (top = top-left of the board); click a row to edit it; use the + button to add a piece.
    media_folder: /assets/paintings
    public_folder: /assets/paintings
    files:
      - name: board
        label: Collage board
        file: content/paintings.json
        format: json
        media_folder: /assets/paintings
        public_folder: /assets/paintings
        fields:
          - label: Pieces
            name: pieces
            widget: list
            collapsed: true
            thumbnail: image
            summary: "{{fields.title}} · {{fields.kind}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Photo, name: image, widget: image, hint: JPG or PNG. Phone photos are shrunk automatically. }
              - { label: Kind, name: kind, widget: select, options: [{ label: Flash sheet, value: flash }, { label: Painting, value: painting }], default: painting }
              - { label: Year, name: year, widget: string, required: false }
              - { label: Hidden, name: hidden, widget: boolean, default: false, required: false }
              - { label: Notes, name: notes, widget: text, required: false }

  - name: videos
    label: Game montages
    description: The YouTube playlist in the Games department. Drag rows to reorder; the featured one plays first.
    files:
      - name: playlist
        label: Playlist
        file: content/videos.json
        format: json
        fields:
          - label: Videos
            name: videos
            widget: list
            collapsed: true
            summary: "{{fields.title}} ({{fields.game}})"
            fields:
              - { label: YouTube video ID, name: id, widget: string, hint: 'The part after v= in the link, e.g. 6h6MYeb7vA0.' }
              - { label: Title, name: title, widget: string }
              - { label: Game, name: game, widget: string, hint: Used for the filter chips. Spell it the same way every time. }
              - { label: Tag, name: tag, widget: string, required: false, hint: Character, mode, whatever. }
              - { label: Year, name: year, widget: string, required: false }
              - { label: Featured, name: featured, widget: boolean, default: false, required: false, hint: Plays first when the page opens. }

  - name: genetics
    label: SpaceCraft genetics
    label_singular: Plant
    description: Every plant on the star chart. Add a cross and pick its mother and father from the list; generations are worked out automatically.
    folder: content/genetics
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} · {{kind}}"
    sortable_fields: [name, kind, run, flagship]
    fields:
      - { label: Name, name: name, widget: string, hint: "Use ♂ / ♀ in the name if it helps, e.g. Charcuterie ♂." }
      - { label: Kind, name: kind, widget: select, options: [{ label: SpaceCraft cross, value: spacecraft }, { label: Clone-only cut, value: cut }, { label: Seed line, value: seedline }, { label: Homebrew line (someone else's), value: homebrew }, { label: Landrace, value: landrace }, { label: Bagseed, value: bagseed }, { label: Unknown, value: unknown }], default: spacecraft }
      - { label: Breeder / source, name: breeder, widget: string, required: false }
      - { label: Mother, name: mother, widget: relation, collection: genetics, value_field: "{{slug}}", display_fields: ["{{name}}"], search_fields: [name], required: false }
      - { label: Father, name: father, widget: relation, collection: genetics, value_field: "{{slug}}", display_fields: ["{{name}}"], search_fields: [name], required: false, hint: For an F2 pick the same line as both parents. }
      - { label: Run, name: run, widget: select, options: [{ label: none (outside plant), value: 0 }, { label: "1 · Charcuterie 2024", value: 1 }, { label: "2 · Lime Bubble 2025", value: 2 }, { label: "3 · Gushy Kush 2025", value: 3 }, { label: "4 · side chucks 2025", value: 4 }, { label: "5 · pine line 2026", value: 5 }, { label: "6 · outdoor, Pinecake male 2026", value: 6 }], default: 0 }
      - { label: Year, name: year, widget: string, required: false }
      - { label: Flagship, name: flagship, widget: boolean, default: false, required: false, hint: A SpaceCraft line you bred with again. Shows as a gold star. }
      - { label: Status, name: status, widget: string, required: false, hint: "released, unreleased, testing, stock, unnamed, unknown…" }
      - { label: Terps, name: terps, widget: string, required: false }
      - { label: Notes, name: notes, widget: text, required: false }
      - { label: Source note, name: source, widget: string, required: false }
      - { label: Seedfinder link, name: seedfinder, widget: string, required: false }
      - { label: Photo, name: image, widget: image, required: false, media_folder: /assets/plants, public_folder: /assets/plants, hint: Shown in the plant's dossier on the star chart. }

  - name: departments
    label: Departments
    label_singular: Department
    description: The ParlorOS desktop icons and their windows (Paintings, Games, Store, SpaceCraft).
    folder: content/departments
    format: json
    extension: json
    create: false
    delete: false
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{order}} · {{name}} · {{status}}"
    media_folder: /assets/plants
    public_folder: /assets/plants
    fields:
      - { label: URL slug, name: slug, widget: string, hint: Do not change; it is the page address. }
      - { label: Name, name: name, widget: string }
      - { label: Icon, name: icon, widget: image, hint: Any picture; it is shrunk for the desktop icon. }
      - { label: Blurb, name: blurb, widget: text }
      - { label: Status, name: status, widget: string, hint: Shown in the window and the taskbar. }
      - { label: Order, name: order, widget: number, value_type: int }
      - label: Photos
        name: images
        widget: list
        required: false
        summary: "{{fields.caption}}"
        hint: Only used by departments without their own window (SpaceCraft). Paintings and Games have their own sections above.
        fields:
          - { label: Photo, name: image, widget: image }
          - { label: Caption, name: caption, widget: string }

  # ---------------------------------------------------------------- pages & copy
  - name: pages
    label: Pages
    files:
      - name: about
        label: About page
        file: src/about.md
        fields:
          - { label: Layout, name: layout, widget: hidden, default: layouts/page.njk }
          - { label: Address, name: permalink, widget: hidden, default: /about/ }
          - { label: Tab title, name: title, widget: string }
          - { label: Search description, name: description, widget: string }
          - { label: Heading, name: heading, widget: string }
          - { label: Opening line, name: lede, widget: text, required: false }
          - { label: Show shop facts box, name: facts, widget: boolean, default: true }
          - { label: Body, name: body, widget: markdown }
      - name: aftercare
        label: Aftercare page
        file: src/aftercare.md
        fields:
          - { label: Layout, name: layout, widget: hidden, default: layouts/page.njk }
          - { label: Address, name: permalink, widget: hidden, default: /aftercare/ }
          - { label: Tab title, name: title, widget: string }
          - { label: Search description, name: description, widget: string }
          - { label: Heading, name: heading, widget: string }
          - { label: Opening line, name: lede, widget: text, required: false }
          - { label: Show shop facts box, name: facts, widget: boolean, default: false }
          - { label: Body, name: body, widget: markdown }

  - name: home
    label: Home page
    files:
      - name: home
        label: Home page sections
        file: src/_data/home.json
        format: json
        fields:
          - label: How-to-order box
            name: howto
            widget: object
            fields:
              - { label: Show, name: show, widget: boolean, default: true }
              - { label: Heading, name: heading, widget: string }
              - { label: Steps, name: steps, widget: list, field: { label: Step, name: step, widget: string }, hint: One line per step. Numbered automatically. }
          - { label: Catalog heading, name: catalogHeading, widget: string }
          - { label: Search box hint, name: searchHint, widget: string, hint: 'Shown after "Search 71 flash designs, "' }
          - label: Custom work card
            name: custom
            widget: object
            fields:
              - { label: Show, name: show, widget: boolean, default: true }
              - { label: Title, name: title, widget: string }
              - { label: Button text, name: button, widget: string }
          - label: Recent work strip
            name: recent
            widget: object
            fields:
              - { label: Show, name: show, widget: boolean, default: true }
              - { label: Heading, name: heading, widget: string }
              - { label: How many photos, name: count, widget: number, value_type: int, min: 0, max: 24 }

  - name: landing
    label: Landing page (TV)
    files:
      - name: landing
        label: Landing page text
        file: src/_data/landing.json
        format: json
        fields:
          - { label: Show the landing page, name: enabled, widget: boolean, default: true, hint: Off sends visitors straight to the flash catalog. }
          - { label: Channel number, name: channel, widget: string, hint: 'Shown on the screen as CH …' }
          - { label: Screen label, name: screenLabel, widget: string, hint: The green text under the channel number. }
          - { label: Yellow line above the welcome, name: kicker, widget: string }
          - { label: Welcome text, name: welcome, widget: text }
          - { label: Blinking caption on the screen, name: caption, widget: string }
          - { label: Button text, name: button, widget: string }
          - { label: Plate under the screen, name: plate, widget: string }
          - { label: Small line under the button, name: footer, widget: string, required: false, hint: Leave blank to show your hours and books status. }
          - { label: Taskbar label, name: taskbarLabel, widget: string }
          - { label: Boot messages, name: bootMessages, widget: list, field: { label: Message, name: message, widget: string }, hint: Cycle in the top bar, about one per second. }

  - name: booking
    label: Booking page
    files:
      - name: booking
        label: Booking page copy
        file: src/_data/booking.json
        format: json
        fields:
          - { label: Heading, name: heading, widget: string }
          - label: The three routes
            name: routes
            widget: object
            fields:
              - label: Request form
                name: request
                widget: object
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Link text, name: link, widget: string }
              - label: Square
                name: square
                widget: object
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Link text, name: link, widget: string }
              - label: Instagram
                name: instagram
                widget: object
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Link text, name: link, widget: string }
          - label: Request form
            name: form
            widget: object
            fields:
              - { label: '"What do you want?" placeholder', name: notesPlaceholder, widget: string }
              - { label: Placement placeholder, name: placementPlaceholder, widget: string }
              - { label: Size placeholder, name: sizePlaceholder, widget: string }
              - { label: Days placeholder, name: daysPlaceholder, widget: string }
              - { label: Reply-time note, name: replyNote, widget: string, hint: The deposit sentence is added after this automatically. }
          - label: Thank-you page
            name: thanks
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text }

  # ---------------------------------------------------------------- ordering
  - name: ordering
    label: Flash order (drag to sort)
    files:
      - name: order
        label: Flash catalog order
        file: src/_data/order.json
        format: json
        fields:
          - label: Flash catalog
            name: flash
            widget: list
            hint: Drag to reorder the catalog. Anything not listed goes at the end in SKU order.
            field: { label: Design, name: design, widget: relation, collection: flash, value_field: "{{slug}}", display_fields: ["{{sku}} {{name}}"], search_fields: [sku, name] }

  # ---------------------------------------------------------------- look
  - name: theme
    label: Look & colors
    files:
      - name: theme
        label: Colors, columns, collage
        file: src/_data/theme.json
        format: json
        fields:
          - label: Catalog (tattoo pages)
            name: catalog
            widget: object
            fields:
              - { label: Brand purple, name: stencil, widget: color, hint: Logo block, links, category highlight. }
              - { label: Yellow, name: yellow, widget: color, hint: Search and Add buttons. }
              - { label: Red, name: red, widget: color, hint: Booking button. }
              - { label: Green, name: green, widget: color, hint: '"Ready" dot.' }
              - { label: Ink, name: ink, widget: color, hint: Text and rules. }
              - { label: Flash columns (desktop), name: columns, widget: number, value_type: int, min: 2, max: 6 }
              - { label: Work-photo columns (desktop), name: workColumns, widget: number, value_type: int, min: 2, max: 8 }
          - label: ParlorOS (other departments)
            name: os
            widget: object
            fields:
              - { label: Wallpaper, name: wall, widget: color }
              - { label: Purple, name: stencil, widget: color }
              - { label: Bone (window color), name: bone, widget: color }
              - { label: Yellow, name: yellow, widget: color }
              - { label: Red, name: red, widget: color }
              - { label: Green, name: green, widget: color }
          - label: Paintings collage
            name: collage
            widget: object
            fields:
              - { label: Tilt (degrees), name: tilt, widget: number, value_type: float, min: 0, max: 8, step: 0.5, hint: 0 = straight rows, 2 = a little crooked, 5 = messy desk. }
              - { label: Tape strips, name: tape, widget: boolean, default: true }
              - { label: Smallest piece width (px), name: columnWidth, widget: number, value_type: int, min: 100, max: 260, step: 10, hint: Smaller = more pieces per row. }

  # ------------------------------------------------------------ breeding runs
  - name: runs
    label: Breeding runs
    files:
      - name: runs
        label: The six runs
        description: One entry per run. This is what the "THE RUN" tab on each cross reads, and what names the filters on the bred-in-house board.
        file: src/_data/runs.json
        format: json
        fields:
          - label: Runs
            name: runs
            widget: list
            label_singular: Run
            summary: 'Run {{fields.n}} · {{fields.name}} · {{fields.season}}'
            fields:
              - { label: Run number, name: n, widget: number, value_type: int, min: 1, hint: Must match the Run picked on each plant. }
              - { label: Short name, name: name, widget: string, hint: 'The male that carried it, e.g. Lime Bubble.' }
              - { label: When, name: season, widget: string, hint: 'e.g. Jan–Mar 2025.' }
              - { label: Year, name: year, widget: string }
              - { label: Pollen donor, name: donor, widget: string, hint: 'The male, with the breeder in brackets.' }
              - { label: About the male, name: donorNote, widget: text, required: false, hint: What it was, why it was picked, what it threw. }
              - { label: Dates, name: dates, widget: text, required: false, hint: 'Flip, pollen, chop, pack — the line of dates under the story.' }
              - { label: The story, name: story, widget: text, required: false, hint: One or two lines on what this run was. }

  # ---------------------------------------------------------------- identity
  - name: settings
    label: Site settings
    files:
      - name: site
        label: Identity, hours, pricing, links
        file: src/_data/site.json
        format: json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Short name, name: shortName, widget: string }
          - { label: Site title, name: title, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Top strip label, name: catalogLabel, widget: string, hint: The first words in the black strip above the catalog, e.g. Online catalog. }
          - { label: Books status, name: booksStatus, widget: string, hint: e.g. Books open, Books closed, Waitlist. }
          - { label: Hours (short), name: hoursShort, widget: string }
          - { label: Hours (long), name: hoursLong, widget: string }
          - label: Shop
            name: shop
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: City, name: city, widget: string }
              - { label: Area, name: area, widget: string }
              - { label: Address, name: address, widget: string, required: false }
              - { label: Map link, name: mapUrl, widget: string, required: false }
              - { label: Street, name: street, widget: string, required: false, hint: 'Used by Google to place the shop on the map, e.g. 1009 W Fourth Plain Blvd.' }
              - { label: Town, name: locality, widget: string, required: false, hint: 'Just the town, e.g. Vancouver.' }
              - { label: State, name: region, widget: string, required: false, hint: 'Two letters, e.g. WA.' }
              - { label: ZIP code, name: postalCode, widget: string, required: false, hint: Helps Google show the shop in local results. }
          - { label: Instagram handle, name: instagram, widget: string }
          - { label: Square booking link, name: squareBooking, widget: string }
          - label: Pricing
            name: pricing
            widget: object
            fields:
              - { label: Shop minimum, name: shopMinimum, widget: number, value_type: int }
              - { label: Deposit, name: deposit, widget: number, value_type: int }
              - { label: Deposit note, name: depositNote, widget: text }
              - { label: Pricing note, name: note, widget: text }
          - { label: Domain, name: domain, widget: string, required: false, hint: 'The full address of the site, e.g. https://christattooer.com. Needed for share previews and Google.' }
          - { label: Share picture, name: ogImage, widget: image, required: false, hint: The photo shown when someone shares a link to the site on Instagram, in a DM or on Facebook. }
          - { label: Share picture description, name: ogImageAlt, widget: string, required: false, hint: One line describing that photo, read aloud by screen readers. }
          - label: Opening hours (for Google)
            name: openingHours
            widget: list
            required: false
            summary: '{{fields.hours}}'
            hint: 'One line per day you are in, in the form Mo 12:00-19:00. Leave the list empty rather than guessing — whatever is here can show up in Google.'
            field: { label: Day and times, name: hours, widget: string }
          - label: YouTube
            name: youtube
            widget: object
            fields:
              - { label: Channel name, name: name, widget: string }
              - { label: Handle, name: handle, widget: string }
              - { label: Channel ID, name: channelId, widget: string }
          - { label: Twitch channel, name: twitch, widget: string }
