[build]
  command = "npm run build"
  publish = "_site"
  # Pushes and admin saves only commit; nothing deploys until the "Publish site" button in the admin
  # fires the build hook (build hooks bypass this). Keeps deploys, and Netlify credits, under control.
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "/netlify/plugins/thumb-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
